[project]
name = "gemini-vibe-companion"
version = "0.1.0"
description = "Modular local companion for Gemini-assisted coding with human-gated file/patch tools, Copy-on-Write savepoints, Git commit/push, and project-scoped backups."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "google-genai>=1.0.0",
    "websockets>=13.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
